services:
  - type: web
    name: nexnetra-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run dev
    envVars:
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        value: https://your-frontend-url.example
      - key: JWT_SECRET
        generateValue: true
